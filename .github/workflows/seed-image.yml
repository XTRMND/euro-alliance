name: Seed image

# The staging seed's image (docs/seeding.md): the Dockerfile's `seed` stage, with the source and
# every dependency, which the site's image doesn't carry. Built on demand (Actions → Seed image →
# Run workflow, on main) and pushed to Docker Hub as musev/eac:seed-staging and
# seed-staging-<sha>, because the VPS never builds. Too big (about 1.9 GB) to push on every merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: seed
          push: true
          tags: |
            musev/eac:seed-staging
            musev/eac:seed-staging-${{ github.sha }}
          cache-from: type=gha
