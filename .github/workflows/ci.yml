name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main gets a full run; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://euro_alliance:euro_alliance@localhost:5432/euro_alliance
  # Only for CI's throwaway databases.
  PAYLOAD_SECRET: ci-only-not-a-secret

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - name: Migrations and generated files are up to date
        run: |
          pnpm --silent payload migrate:create ci-drift-check --skip-empty
          pnpm --silent generate:types
          pnpm --silent generate:importmap
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Schema or generated files changed. Run pnpm migrate:create, pnpm generate:types and pnpm generate:importmap, then commit the result."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: euro_alliance
          POSTGRES_PASSWORD: euro_alliance
          POSTGRES_DB: euro_alliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euro_alliance -d euro_alliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://euro_alliance:euro_alliance@localhost:5432/euro_alliance
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:int

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: euro_alliance
          POSTGRES_PASSWORD: euro_alliance
          POSTGRES_DB: euro_alliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euro_alliance -d euro_alliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm build
      # tar keeps the symlinks in the standalone output.
      - run: tar -cf standalone.tar .next/standalone
      - uses: actions/upload-artifact@v7
        with:
          name: standalone
          path: standalone.tar
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: standalone
      - run: tar -xf standalone.tar
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: standalone
      - run: tar -xf standalone.tar
      - run: pnpm lhci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the new commits
        run: ./gitleaks git --redact --verbose --log-opts="${RANGE}"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built on every PR so it's ready to deploy; pushing waits for the registry decision.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: euro-alliance:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
