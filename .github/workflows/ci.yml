name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main gets a full run; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://euro_alliance:euro_alliance@localhost:5432/euro_alliance
  # Only for CI's throwaway databases.
  PAYLOAD_SECRET: ci-only-not-a-secret

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - name: Migrations and generated files are up to date
        run: |
          pnpm --silent payload migrate:create ci-drift-check --skip-empty
          pnpm --silent generate:types
          pnpm --silent generate:importmap
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Schema or generated files changed. Run pnpm migrate:create, pnpm generate:types and pnpm generate:importmap, then commit the result."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: euro_alliance
          POSTGRES_PASSWORD: euro_alliance
          POSTGRES_DB: euro_alliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euro_alliance -d euro_alliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://euro_alliance:euro_alliance@localhost:5432/euro_alliance
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:int

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: euro_alliance
          POSTGRES_PASSWORD: euro_alliance
          POSTGRES_DB: euro_alliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euro_alliance -d euro_alliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm build
      # tar keeps the symlinks in the standalone output.
      - run: tar -cf standalone.tar .next/standalone
      - uses: actions/upload-artifact@v7
        with:
          name: standalone
          path: standalone.tar
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    # Pages read the CMS; the server migrates and seeds this database on its first request.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: euro_alliance
          POSTGRES_PASSWORD: euro_alliance
          POSTGRES_DB: euro_alliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euro_alliance -d euro_alliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: standalone
      - run: tar -xf standalone.tar
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # New visual baselines are written on the first run; commit them from this artifact.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    # Pages read the CMS; the server migrates and seeds this database on its first request.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: euro_alliance
          POSTGRES_PASSWORD: euro_alliance
          POSTGRES_DB: euro_alliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euro_alliance -d euro_alliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: standalone
      - run: tar -xf standalone.tar
      - run: pnpm lhci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the new commits
        run: ./gitleaks git --redact --verbose --log-opts="${RANGE}"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}

  # Builds the image on every PR. On main it's pushed to Docker Hub for staging. NEXT_PUBLIC_* is
  # baked in at build time, so this image carries the staging address; production gets its own.
  docker:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          build-args: NEXT_PUBLIC_SITE_URL=https://staging.euro-alliance.net
          tags: |
            musev/eac:site-staging
            musev/eac:site-staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Staging (deploy/README.md): every push to main goes to https://staging.euro-alliance.net once
  # the fast checks pass and the image is pushed. e2e and Lighthouse still run but don't hold it.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, test, secrets, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.euro-alliance.net
    steps:
      # The key may only run /opt/euro-alliance-staging/deploy.sh (a forced command on the VPS).
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.STAGING_DEPLOY_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: /opt/euro-alliance-staging/deploy.sh
